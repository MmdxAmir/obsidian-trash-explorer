name: Build Obsidian plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: trash-explorer-build
          path: |
            main.js
            manifest.json
          if-no-files-found: error
          retention-days: 14
